name: Build libsm64 armeabi-v7a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar libsm64-retro64
        run: git clone --depth 1 https://github.com/Retro64Mod/libsm64-retro64 src_repo

      - name: Compilar para armeabi-v7a (32 bits)
        working-directory: src_repo
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          chmod +x import-mario-geo.py
          make lib \
            CC="$TC/armv7a-linux-androideabi21-clang" \
            CXX="$TC/armv7a-linux-androideabi21-clang++" \
            CFLAGS="-g0 -O2 -fPIC -fcommon -DSM64_LIB_EXPORT -DGBI_FLOATS -DVERSION_US -DNO_SEGMENTED_MEMORY -w -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-incompatible-function-pointer-types" \
            LDFLAGS="-lm -shared"

      - name: Verificar que es ARM de 32 bits y ver funciones exportadas
        working-directory: src_repo
        run: |
          file dist/libsm64.so
          readelf -h dist/libsm64.so | grep -E "Class|Machine"
          nm -D --defined-only dist/libsm64.so | grep sm64_ | sort -k3

      - name: Subir libsm64.so
        uses: actions/upload-artifact@v4
        with:
          name: libsm64-armeabi-v7a
          path: |
            src_repo/dist/libsm64.so
            src_repo/dist/include/libsm64.h
